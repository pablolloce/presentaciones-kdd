<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diplomas - Escuela Infantil Rocío Durcal - Promoción 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&family=Dancing+Script:wght@700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f0f0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 40px 0;
    font-family: 'Nunito', sans-serif;
  }

  .slide {
    width: 1280px;
    height: 720px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #fff5f5 0%, #fff 40%, #fff5f5 100%);
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    flex-shrink: 0;
  }

  .border-frame {
    position: absolute;
    inset: 12px;
    border: 4px solid #c0392b;
    border-radius: 18px;
    pointer-events: none;
    z-index: 1;
  }
  .border-frame::before {
    content: '';
    position: absolute;
    inset: 5px;
    border: 2px dashed #e74c3c;
    border-radius: 14px;
    opacity: 0.5;
  }

  .corner {
    position: absolute;
    width: 80px;
    height: 80px;
    z-index: 2;
  }
  .corner svg { width: 100%; height: 100%; }
  .corner-tl { top: 20px; left: 20px; }
  .corner-tr { top: 20px; right: 20px; transform: scaleX(-1); }
  .corner-bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
  .corner-br { bottom: 20px; right: 20px; transform: scale(-1); }

  .confetti {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    opacity: 0.12;
  }
  .confetti-piece {
    position: absolute;
    font-size: 20px;
  }

  .top-banner {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    text-align: center;
  }
  .top-banner .birrete {
    font-size: 52px;
    line-height: 1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }

  .bunting {
    position: absolute;
    top: 16px;
    left: 100px;
    right: 100px;
    height: 50px;
    z-index: 3;
    display: flex;
    justify-content: center;
  }
  .bunting svg {
    width: 100%;
    height: 50px;
  }

  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 4;
    padding: 40px 60px;
  }

  .diploma-title {
    font-family: 'Fredoka One', cursive;
    font-size: 72px;
    color: #c0392b;
    text-transform: uppercase;
    letter-spacing: 8px;
    margin-top: 40px;
    text-shadow: 2px 2px 0 rgba(192, 57, 43, 0.15);
  }

  .subtitle {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 24px;
    color: #e74c3c;
    margin-top: 6px;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .award-text {
    font-family: 'Nunito', sans-serif;
    font-size: 20px;
    color: #666;
    margin-top: 24px;
    font-weight: 600;
  }

  .student-name {
    font-family: 'Dancing Script', cursive;
    font-size: 68px;
    color: #2c3e50;
    margin-top: 8px;
    padding: 4px 40px;
    border-bottom: 3px solid #e74c3c;
    line-height: 1.3;
    white-space: nowrap;
  }

  .description {
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    color: #777;
    margin-top: 18px;
    text-align: center;
    max-width: 700px;
    line-height: 1.5;
    font-weight: 600;
  }

  .promotion {
    font-family: 'Fredoka One', cursive;
    font-size: 26px;
    color: #c0392b;
    margin-top: 16px;
    letter-spacing: 2px;
    white-space: nowrap;
  }
  .promotion span {
    background: linear-gradient(135deg, #c0392b, #e74c3c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .footer-row {
    position: absolute;
    bottom: 40px;
    left: 80px;
    right: 80px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 5;
  }
  .footer-item {
    text-align: center;
    font-size: 14px;
    color: #999;
    font-weight: 700;
  }
  .footer-item .line {
    width: 180px;
    height: 1.5px;
    background: #ccc;
    margin-bottom: 6px;
  }
  .footer-item .signature-text {
    font-family: 'Dancing Script', cursive;
    font-size: 22px;
    color: #2c3e50;
    margin-bottom: 4px;
  }

  .deco-left, .deco-right {
    position: absolute;
    z-index: 3;
    opacity: 0.9;
  }
  .deco-left { bottom: 24px; left: 24px; }
  .deco-right { bottom: 24px; right: 24px; }

  .balloons-left, .balloons-right {
    position: absolute;
    z-index: 3;
  }
  .balloons-left { top: 40px; left: 20px; }
  .balloons-right { top: 40px; right: 20px; }

  @media print {
    body {
      background: none !important;
      gap: 0;
      padding: 0;
      margin: 0;
      display: block;
    }
    .slide {
      box-shadow: none;
      page-break-after: always;
      page-break-inside: avoid;
      width: 100vw !important;
      height: 100vh !important;
      margin: 0;
      transform: none !important;
    }
    .slide:last-child {
      page-break-after: auto;
    }
  }

  @page {
    size: A4 landscape;
    margin: 0;
  }
</style>
</head>
